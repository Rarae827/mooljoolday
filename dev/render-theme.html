<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>[DEV] 곡 음원 내보내기 · MooljoolDay</title>
  <style>
    body { font-family: system-ui, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; background: #EEF3E4; color: #2F5E3E; padding: 24px; }
    h1 { font-size: 22px; margin-bottom: 8px; }
    p { font-size: 14px; line-height: 1.6; color: #6A7F5E; }
    select, button { font: inherit; font-size: 15px; padding: 8px 14px; border-radius: 10px; border: 1px solid #C8D6B4; margin: 12px 8px 0 0; }
    button { background: #2F5E3E; color: #fff; border: none; cursor: pointer; }
    #log { margin-top: 16px; white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 13px; color: #2F5E3E; }
  </style>
</head>
<body>
  <h1>곡 음원 내보내기 (개발자 전용)</h1>
  <p>게임과 같은 오디오 엔진으로 곡을 소리 없이(오프라인) 렌더링해 MP3로 저장해요.<br>
     저장은 로컬 저장 서버(127.0.0.1:5175)가 켜져 있을 때 <code>music/</code> 폴더로 들어가요.</p>
  <select id="song"></select><button id="go">MP3 만들기</button>
  <div id="log"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js"></script>
  <script src="../web/js/audio.js"></script>
  <script src="../web/js/song.js"></script>
  <script src="../web/js/songs/mooljoolday.js"></script>
  <script src="../web/js/songs/classics.js"></script>
  <script>
    const log = (s) => { document.getElementById('log').textContent += s + '\n'; };
    const sel = document.getElementById('song');
    for (const id of SONG_ORDER) sel.add(new Option(SONGS[id].title, id));

    async function renderSong(id) {
      const song = buildSong(SONGS[id]);
      const sr = 44100;
      const spb = 60 / song.bpm;
      const lead = 0.4, tail = 3.5;
      const dur = lead + song.totalBeats * spb + tail;
      const ctx = new OfflineAudioContext(2, Math.ceil(dur * sr), sr);
      const eng = new AudioEngine();
      eng.setup(ctx);
      eng.prepare(song);
      for (const e of song.events) eng.play(e, lead + e.beat * spb, spb);
      // 끝부분 잔향을 자연스럽게 페이드아웃
      eng.master.gain.setValueAtTime(eng.master.gain.value, dur - 2);
      eng.master.gain.linearRampToValueAtTime(0, dur);
      log(`렌더링 중… (${dur.toFixed(1)}초)`);
      const buf = await ctx.startRendering();
      return { buf, dur };
    }

    function toMp3(buf, kbps) {
      const L = buf.getChannelData(0), R = buf.getChannelData(1);
      let peak = 0;
      for (let i = 0; i < L.length; i++) peak = Math.max(peak, Math.abs(L[i]), Math.abs(R[i]));
      const gain = peak > 0 ? 0.89 / peak : 1; // 피크 약 -1dBFS로 맞춤
      const toI16 = (src) => {
        const out = new Int16Array(src.length);
        for (let i = 0; i < src.length; i++) out[i] = Math.max(-32768, Math.min(32767, Math.round(src[i] * gain * 32767)));
        return out;
      };
      const l16 = toI16(L), r16 = toI16(R);
      const enc = new lamejs.Mp3Encoder(2, buf.sampleRate, kbps);
      const parts = [];
      for (let i = 0; i < l16.length; i += 1152) {
        const d = enc.encodeBuffer(l16.subarray(i, i + 1152), r16.subarray(i, i + 1152));
        if (d.length) parts.push(new Uint8Array(d));
      }
      const end = enc.flush();
      if (end.length) parts.push(new Uint8Array(end));
      return { blob: new Blob(parts, { type: 'audio/mpeg' }), peak };
    }

    async function renderAndSave(id, fileName) {
      const t0 = performance.now();
      const { buf, dur } = await renderSong(id);
      const { blob, peak } = toMp3(buf, 192);
      log(`MP3 인코딩 완료: ${(blob.size / 1024 / 1024).toFixed(2)}MB, 원래 피크 ${peak.toFixed(2)}`);
      const res = await fetch(`http://127.0.0.1:5175/save?name=${encodeURIComponent(fileName)}`, { method: 'POST', body: blob });
      const msg = `${res.status} ${await res.text()}`;
      log(`저장: ${fileName} → ${msg} (${((performance.now() - t0) / 1000).toFixed(1)}초 걸림)`);
      return { dur: +dur.toFixed(1), size: blob.size, peak: +peak.toFixed(3), saved: msg };
    }
    window.renderAndSave = renderAndSave;

    document.getElementById('go').addEventListener('click', () => {
      const id = sel.value;
      renderAndSave(id, `MooljoolDay_${id}.mp3`).catch((e) => log('오류: ' + e.message));
    });
  </script>
</body>
</html>
